x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  init: true

x-rabbitmq-environment: &rabbitmq-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-/}

x-service-dependencies: &service-dependencies
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  api-gateway:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    env_file:
      - path: ./services/api_gateway/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-false}
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8001
      ACADEMIC_SERVICE_URL: http://academic-service:8002
      SCHEDULE_SERVICE_URL: http://schedule-service:8003
      CONTENT_SERVICE_URL: http://content-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
      COMMUNICATION_SERVICE_URL: http://communication-service:8006
      NEWS_SERVICE_URL: http://news-service:8007
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    expose:
      - "8080"
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      academic-service:
        condition: service_started
      schedule-service:
        condition: service_started
      content-service:
        condition: service_started
      notification-service:
        condition: service_started
      communication-service:
        condition: service_started
      news-service:
        condition: service_started

  auth-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    env_file:
      - path: ./services/auth_service/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vsp}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    expose:
      - "8000"
    depends_on: *service-dependencies

  user-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    env_file:
      - path: ./services/user_service/.env
        required: false
    environment:
      <<: *rabbitmq-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vsp}
      ENVIRONMENT: ${APP_ENV:-development}
    expose:
      - "8001"
    depends_on: *service-dependencies

  academic-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/academic_service/Dockerfile
    env_file:
      - path: ./services/academic_service/.env
        required: false
    environment:
      <<: *rabbitmq-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vsp}
      ENVIRONMENT: ${APP_ENV:-development}
    expose:
      - "8002"
    depends_on: *service-dependencies

  schedule-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/schedule_service/Dockerfile
    env_file:
      - path: ./services/schedule_service/.env
        required: false
    environment:
      <<: *rabbitmq-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vsp}
      ENVIRONMENT: ${APP_ENV:-development}
    expose:
      - "8003"
    depends_on: *service-dependencies

  content-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/content_service/Dockerfile
    env_file:
      - path: ./services/content_service/.env
        required: false
    environment:
      <<: *rabbitmq-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vsp}
      ENVIRONMENT: ${APP_ENV:-development}
    expose:
      - "8004"
    depends_on: *service-dependencies

  notification-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    env_file:
      - path: ./services/notification_service/.env
        required: false
    environment:
      <<: *rabbitmq-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vsp}
      ENVIRONMENT: ${APP_ENV:-development}
      SMTP_HOST: ${SMTP_HOST:-smtp.mail.ru}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CONTACT_RECEIVER_EMAIL: ${CONTACT_RECEIVER_EMAIL:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-20}
    expose:
      - "8005"
    depends_on: *service-dependencies

  communication-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/communication_service/Dockerfile
    env_file:
      - path: ./services/communication_service/.env
        required: false
    environment:
      <<: *rabbitmq-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vsp}
      ENVIRONMENT: ${APP_ENV:-development}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-8}
    expose:
      - "8006"
    depends_on: *service-dependencies

  news-service:
    <<: *app-defaults
    build:
      context: .
      dockerfile: services/news_service/Dockerfile
    env_file:
      - path: ./services/news_service/.env
        required: false
    environment:
      <<: *rabbitmq-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vsp}
      ENVIRONMENT: ${APP_ENV:-development}
    expose:
      - "8007"
    depends_on: *service-dependencies

  postgres:
    image: postgres:16
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vsp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    networks:
      - backend
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VIRTUAL_HOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - backend
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
